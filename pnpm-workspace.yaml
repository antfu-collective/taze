ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - verkit@0.3.2
  - fast-npm-meta@2.2.0
  - get-npm-meta@0.3.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.2

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - '!**/test/fixtures/**'

overrides:
  fast-npm-meta: ^2.2.0
  package-manager-detector: ^1.8.0

allowBuilds:
  esbuild: true

catalogs:
  dev:
    '@antfu/eslint-config': ^9.5.1
    bumpp: ^12.3.0
    eslint: ^10.11.0
    knip: ^6.38.0
    tsdown: ^0.23.0
    tsx: ^4.23.15
    typescript: ^6.0.3
    vitest: ^5.0.1
  inlined:
    '@antfu/utils': ^9.3.0
    '@posva/prompts': ^2.4.4
    ansis: ^4.4.0
    cli-progress: ^3.12.0
    deepmerge: ^4.3.1
    detect-indent: ^7.0.2
    empathic: ^2.1.0
    get-npm-meta: ^0.3.0
  prod:
    '@antfu/ni': ^30.6.0
    '@henrygd/queue': ^1.2.0
    cac: ^7.0.0
    obug: ^3.0.0
    ofetch: ^1.5.1
    package-manager-detector: ^1.8.0
    pathe: ^2.0.3
    pnpm-workspace-yaml: ^1.9.1
    restore-cursor: ^5.1.0
    tinyexec: ^1.3.1
    tinyglobby: ^0.2.17
    unconfig: ^7.5.0
    verkit: ^0.5.0
    yaml: ^2.9.1
  types:
    '@types/cli-progress': ^3.11.6
    '@types/node': ^26.6.2
